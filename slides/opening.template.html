<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /*__DYNAMIC_STYLE__*/
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: var(--canvas-width, 1800px);
    height: var(--canvas-height, 1200px);
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { width: 1100px; text-align: center; }
  .kicker { font-family: var(--font, system-ui); font-weight: 500; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent, #a3a3a3); margin-bottom: 22px; }
  .title { font-family: var(--font, system-ui); font-weight: 700; font-size: 72px; line-height: 1.1; color: #ffffff; margin-bottom: 26px; }
  .subtitle { font-family: var(--font, system-ui); font-weight: 400; font-size: 26px; line-height: 1.5; color: #a3a3a3; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker" id="kicker"></div>
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <script>
    const DATA = "__DATA__"; // replaced with a real JSON literal by render_slides.js
    document.getElementById('kicker').textContent = DATA.kicker || '';
    document.getElementById('title').textContent = DATA.text;
    document.getElementById('subtitle').textContent = DATA.subtitle;
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /*__DYNAMIC_STYLE__*/
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: var(--canvas-width, 1800px);
    height: var(--canvas-height, 1200px);
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { width: 900px; }
  .kicker { font-family: var(--font, system-ui); font-weight: 500; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent, #a3a3a3); margin-bottom: 28px; text-align: center; }
  ol { list-style: none; display: flex; flex-direction: column; gap: 22px; counter-reset: part; }
  li { font-family: var(--font, system-ui); font-weight: 500; font-size: 34px; color: #ffffff; display: flex; align-items: baseline; gap: 20px; }
  li::before {
    counter-increment: part;
    content: counter(part);
    font-family: var(--font, system-ui);
    font-weight: 600; font-size: 20px; color: var(--accent, #a3a3a3);
    border: 1px solid var(--accent, #525252); border-radius: 50%;
    width: 34px; height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">What's inside</div>
    <ol id="list"></ol>
  </div>
  <script>
    // Only lists the parts by title — the narration playing over this slide
    // deliberately does NOT enumerate them out loud (see
    // references/slide-design.md); the viewer reads this list instead.
    const DATA = "__DATA__"; // replaced with a real JSON literal by render_slides.js — { parts: [{title}] }
    document.getElementById('list').innerHTML = DATA.parts.map((p) => `<li>${p.title}</li>`).join('');
  </script>
</body>
</html>

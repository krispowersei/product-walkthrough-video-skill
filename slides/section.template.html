<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /*__DYNAMIC_STYLE__*/
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: var(--canvas-width, 1800px);
    height: var(--canvas-height, 1200px);
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; }
  .kicker { font-family: var(--font, system-ui); font-weight: 500; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent, #a3a3a3); margin-bottom: 28px; }
  .title { font-family: var(--font, system-ui); font-weight: 500; font-size: 52px; color: #ffffff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker" id="kicker"></div>
    <div class="title" id="title"></div>
  </div>
  <script>
    const DATA = "__DATA__"; // replaced with a real JSON literal by render_slides.js — one part's {kicker, title}
    document.getElementById('kicker').textContent = DATA.kicker;
    document.getElementById('title').textContent = DATA.title;
  </script>
</body>
</html>
